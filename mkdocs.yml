site_name: StatsDash Dokumentáció
site_url: https://docs.statsdash.hu
site_description: Felhasználói dokumentáció a StatsDash versenypontszám-kezelő rendszerhez
docs_dir: docs

theme:
  name: material
  language: hu
  font:
    text: Merriweather
    code: Red Hat Mono
  logo: assets/icon.png
  favicon: assets/favicon.ico
  features:
    - navigation.footer
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tooltips
    - toc.follow
  palette:
    # Sötét mód – elsőként, mert az app alapértelmezett témája sötét
    - scheme: slate
      primary: blue
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Váltás világos módra

    # Világos mód – az app light témájához igazítva (kék primary, teal accent)
    - scheme: default
      primary: blue
      accent: teal
      toggle:
        icon: material/weather-night
        name: Váltás sötét módra

markdown_extensions:
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra:
  social:
    - icon: material/web
      link: https://v2.statsdash.hu

    - icon: material/email
      link: mailto:info@statsdash.hu

copyright: Copyright &copy; 2026 StatsDash - Balogh-Tatai Levente