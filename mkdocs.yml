site_name: StatsDash Dokumentáció
site_url: https://docs.statsdash.hu
theme:
  name: material
  font:
    text: Merriweather
    code: Red Hat Mono
  logo: assets/icon.png
  favicon: assets/favicon.ico
  features:
    - navigation.footer
  palette:
    
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Dark mode
      primary: green
      accent: deep purple

    
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Light mode
      primary: blue
      accent: deep orange

markdown_extensions:
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details

extra:
  social:
    - icon: material/web
      link: https://v2.statsdash.hu
    
    - icon: material/email
      link: mailto:info@statsdash.hu

copyright: Copyright &copy; 2026 StatsDash - Balogh-Tatai Levente